# Ask the City — eval set. Shape and scoring in EVALS.md.
#
# 24 reported questions (split: test). The refusal threshold is never tuned on them: the
# refusal rule adds ~10 `split: dev` questions (5 answer, 5 refuse) that never appear in the table.
# Three more dev answers (`dev-amended-*`, `dev-deleted-*`) cover amended and deleted sections for
# the `shipped-2` prompt fix (LADDER.md, "Ship bar"); the threshold was calibrated before them.
#
# Snapshot facts checked 2026-10-26 against the cached Code, the 120 candidate amending
# by-laws and the live item pages. Patterns marked `pin` name a by-law clause whose exact
# chunk id depends on how the chunker splits it; pin them against the first ingestion
# (a pattern matching nothing is stale gold, never a miss).
#
# A § amended since its chapter's consolidation makes the amending clause a required
# group: an answer from the stale consolidation alone is incomplete even when its facts
# happen to match.
#
# Gold audit (2026-11-01, #56): `acceptable` entries after a `# audit` comment were added from
# a human review of citations outside gold in every committed test run (evals/gold_audit.csv).
# A chunk was added only when it states the sentence that cites it. `required` is unchanged.

# ── resident_rules: everyday words, not by-law vocabulary ─────────────────────────────

- id: rules-drone-park
  question: Can I fly my drone in High Park?
  category: resident_rules
  expect: answer
  required:
    - [ "tmc:608-19:*" ]
    - [ "bl:1482-2025:cl1*" ]          # pin: the item replacing § 608-19 (in force 2026-03-02)
  acceptable: [ "tmc:608-1:*" ]
  key_facts:
    - Operating a drone in a City park is not allowed without a permit.
  split: test
  notes: >
    The consolidated § 608-19 says "powered models of aircraft"; 1482-2025 rewrote it to
    name drones. Lexical search now finds the companion, semantic search the old text.

- id: rules-saturday-drilling
  question: My contractor wants to start drilling at 7:30 on a Saturday. Is that allowed?
  category: resident_rules
  expect: answer
  required:
    - [ "tmc:591-2.3:*" ]
  acceptable: [ "tmc:591-1.1:*",
                "tmc:519:schedule-a:1", "tmc:591-2.6" ]   # audit
  key_facts:
    - No — audible construction noise is prohibited before 9 a.m. on Saturdays.
  split: test

- id: rules-apartment-heat
  question: My apartment is freezing. How warm does my landlord have to keep it?
  category: resident_rules
  expect: answer
  required:
    - [ "tmc:497-2.1:*" ]              # new Ch 497 (By-law 1511-2025, in force 2026-06-01)
  acceptable: [ "tmc:497-1.1:*",
                "bl:1512-2025:629-4.25", "tmc:629-38" ]   # audit
  key_facts:
    - The landlord must keep at least 21 °C.
    - The requirement runs from October 1 to May 15.
    - It applies only where heat is normally included at the landlord's expense.
  split: test
  notes: >
    The 2025 consolidation of Ch 497 is stale (whole chapter replaced). Same numbers, new
    § 497-2.1, now measured 1.5 m above the floor.

- id: rules-sidewalk-snow
  question: How long do I have to shovel the sidewalk after it snows?
  category: resident_rules
  expect: answer
  required:
    - [ "tmc:719-2:*" ]
  acceptable: [ "sr:260413:comments:1", "sr:261102:comments:1", "tmc:719-4.1" ]   # audit
  key_facts:
    - Within 12 hours after the snowfall has stopped.
    - It does not apply where the City has taken on clearing that sidewalk.
  split: test

- id: rules-car-idling
  question: How long can I leave my car running while I wait for someone?
  category: resident_rules
  expect: answer
  required:
    - [ "tmc:517-2:*" ]
  acceptable: [ "tmc:591-2.5" ]   # audit
  key_facts:
    - No more than one minute in any sixty-minute period.
  split: test

- id: rules-dogs-limit
  question: How many dogs am I allowed to have?
  category: resident_rules
  expect: answer
  required:
    - [ "tmc:349-5:*" ]
  acceptable: [ "tmc:608-34.1", "tmc:349-12.1", "tmc:349-11" ]   # audit
  key_facts:
    - Three dogs per dwelling unit.
    - Service animals are not counted.
  split: test
  notes: Deliberately lexical-easy; a baseline the BM25-only rung should already win.

- id: rules-yard-sales
  question: How many yard sales can I hold a year?
  category: resident_rules
  expect: answer
  required:
    - [ "tmc:480-2:*" ]
  acceptable: [ "tmc:480-1:*" ]
  key_facts:
    - Two garage sales per year from a residential premises.
    - The limit applies to the premises, however many people hold the sales.
  split: test

# ── multi_section: needs two §§ ───────────────────────────────────────────────────────

- id: multi-dead-tree
  question: The big tree in my backyard is dead. Can I just cut it down?
  category: multi_section
  expect: answer
  required:
    - [ "tmc:813-12:*" ]
    - [ "tmc:813-13:*" ]
    - [ "bl:402-2026:cl1*" ]           # pin: the item replacing § 813-12 (in force 2026-09-01)
  acceptable: [ "tmc:813-11:*", "ie:2026.IE27.8:*" ]
  key_facts:
    - A permit is needed to remove a tree with a stem of 30 cm or more at 1.4 m above ground.
    - A dead tree is exempt only once the City certifies it as dead.
  split: test
  notes: >
    The naive answer ("dead trees are exempt") misses the certification condition.
    402-2026 also protects trees planted as a condition of an approval at any size and
    moves certification from the General Manager to the Executive Director.

- id: multi-reno-hours-idling
  question: We're renovating. What hours can the crew work, and can they leave their trucks idling?
  category: multi_section
  expect: answer
  required:
    - [ "tmc:591-2.3:*" ]
    - [ "tmc:517-2:*" ]
  acceptable: [ "tmc:519:schedule-a:1", "tmc:591-2.6", "tmc:591-2.5" ]   # audit
  key_facts:
    - Audible construction noise is not allowed from 7 p.m. to 7 a.m. (to 9 a.m. on Saturdays).
    - Audible construction noise is not allowed at all on Sundays and statutory holidays.
    - Vehicles may idle no more than one minute in any sixty-minute period.
  split: test

# ── section_lookup: the section-number exact-match path ─────────────────────────────

- id: lookup-591-2-1
  question: What does 591-2.1 say?
  category: section_lookup
  expect: answer
  required:
    - [ "tmc:591-2.1:*" ]
  acceptable: [ "tmc:591-2.10" ]   # audit
  key_facts:
    - It limits amplified or instrument sound measured at a point of reception.
    - The limit is 50 dB(A) / 65 dB(C) from 11 p.m. to 7 a.m. and 55 dB(A) / 70 dB(C) from 7 a.m. to 11 p.m.
  split: test

- id: lookup-709-3
  question: Summarize Toronto Municipal Code s. 709-3.
  category: section_lookup
  expect: answer
  required:
    - [ "tmc:709-3:*" ]
  key_facts:
    - No smoking within nine metres of any entrance or exit of a public building.
    - The ban does not apply to the part of that radius on the public highway.
  split: test
  notes: Different notation from lookup-591-2-1 on purpose ("s. 709-3").

# ── amended_since: the right answer needs a companion passage ─────────────────────────

- id: amended-manganese-limit
  question: How much manganese can a business discharge into the storm sewers?
  category: amended_since
  expect: answer
  required:
    - [ "tmc:681-4:*" ]
    - [ "bl:470-2026:cl1" ]
  acceptable: [ "ie:2026.IE29.6:*", "sr:286369:*" ]
  key_facts:
    - The storm sewer limit for total manganese is 2.0 mg/L.
    - By-law 470-2026 raised it from 0.05 mg/L, in force May 21, 2026.
  split: test
  notes: Stating 0.05 mg/L as the current limit contradicts the first fact.

- id: amended-summer-cooling
  question: My building has air conditioning. Does my landlord have to actually run it in summer?
  category: amended_since
  expect: answer
  required:
    - [ "tmc:497-2.2:*" ]
  acceptable: [ "tmc:497-2.3:*", "bl:67-2026:cl1",
                "tmc:629-38", "bl:1512-2025:629-4.25" ]   # audit
  key_facts:
    - An installed cooling system must keep the indoor temperature at or below 26 °C.
    - The requirement runs from June 1 to September 30.
    - The rule is in Chapter 497 (Indoor Temperature Standards) since June 1, 2026, not Chapter 629.
  split: test
  notes: >
    The consolidated Ch 629 still carries § 629-38F with the same numbers, but 67-2026
    deleted it. Citing it as the current source contradicts the third fact.

# ── decisions: the committee's items, status stamps ───────────────────────────────────

- id: decisions-electricity-referred
  question: What did the City decide about electricity and its climate commitments in December 2025?
  category: decisions
  expect: answer
  required:
    - [ "ie:2025.IE26.14:*" ]
  acceptable: [ "ie:2025.IE26.3:*",
                "sr:285809:decision-history", "sr:260642:summary:2" ]   # audit
  key_facts:
    - The committee referred the item to the Executive Director without making a decision.
  split: test
  notes: Considered together with IE26.3. Saying it was adopted contradicts the fact.

- id: decisions-tree-size
  question: Is Toronto lowering the size of tree that needs a permit to cut down?
  category: decisions
  expect: answer
  required:
    - [ "ie:2026.IE27.8:*" ]
  acceptable: [ "tmc:813-12:*", "bl:402-2026:*",
                "sr:284390:comments:12", "sr:284390:comments:15" ]   # audit
  key_facts:
    - Council endorsed in principle reducing the protected size from 30 cm to 20 cm in 2027.
    - Staff report back to the committee's first meeting of 2027.
    - The 30 cm threshold still applies today.
  split: test
  notes: Joins Rules and Decisions. Stating 20 cm as the current law contradicts the third fact.

- id: decisions-ebikes
  question: What's the City's position on the new e-bike rules?
  category: decisions
  expect: answer
  required:
    - [ "ie:2026.IE29.10:*" ]
  key_facts:
    - Council supported Ontario's proposed two-class e-bike definition (32 km/h, 500 W, working pedals, minimum age 16, helmets).
    - Council asked the Province for a 55 kg weight limit on Class 2 e-bikes.
  split: test
  notes: Ch 886's "power-assisted bicycle" §§ are the Rules-side trap.

- id: decisions-laneway-snow
  question: Will the City start clearing snow in laneways where people live in laneway houses?
  category: decisions
  expect: answer
  required:
    - [ "ie:2026.IE31.8:*" ]
  acceptable: [ "sr:286719:comments:12", "ie:2026.IE27.15:committee" ]   # audit
  key_facts:
    - The committee referred it to the Deputy City Manager, Infrastructure Services, for a broader review of laneway snow-clearing options.
    - No decision was made.
  split: test
  notes: Phrased yes/no to tempt a "yes". Neighbours rules-sidewalk-snow and refuse-laneway-setback.


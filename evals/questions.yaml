- id: dev-lawn-height
  question: How long can I let my lawn grow before I get in trouble?
  category: resident_rules
  expect: answer
  required:
    - [ "tmc:489-2:*" ]
  acceptable: [ "tmc:489-1:*" ]
  key_facts:
    - Grass must be cut once it grows past 20 centimetres.
  split: dev
  notes: The Code says "turfgrass"; a vocabulary gap meant to score low on the gate.

- id: dev-park-bonfire
  question: Can we have a bonfire at the park for a birthday?
  category: resident_rules
  expect: answer
  required:
    - [ "tmc:608-10:*" ]
  key_facts:
    - An open fire or bonfire in a park needs a permit.
  split: dev

- id: dev-leaf-blower
  question: How late can my neighbour run a leaf blower?
  category: resident_rules
  expect: answer
  required:
    - [ "tmc:591-2.6:*" ]
  acceptable: [ "tmc:591-1.1:*" ]      # the definition companion naming leaf blowers
  key_facts:
    - A power device can't be run from 7 p.m. until 8 a.m. the next day (9 a.m. on weekends and statutory holidays).
  split: dev
  notes: The first example chip. § 591-2.6 says "power device"; the definition naming leaf blowers is in § 591-1.1 (chunk tmc:591-1.1:living-area), candidate 12 after rerank. default-8 declined it; it arrives as a definition companion since #41.

- id: dev-driverless-tickets
  question: Can the City ticket a driverless car?
  category: decisions
  expect: answer
  required:
    - [ "sr:287415:*" ]                # staff report for the June 10, 2026 IE meeting
  acceptable: [ "ie:*" ]               # pin: narrow to the item id once its page is saved
  key_facts:
    - The Province (Ministry of Transportation) licenses automated vehicle operations.
    - Owner liability already covers parking, stopping and standing violations in the Code.
    - Many moving violations assume a human driver, so they don't fit driverless vehicles.
  split: dev

- id: dev-amended-park-fine
  question: What's the biggest fine I could get for breaking a park rule?
  category: amended_since
  expect: answer
  required:
    - [ "tmc:608-54:*" ]
    - [ "bl:1150-2026:cl11" ]
  key_facts:
    - A conviction under the parks chapter carries a fine of up to $100,000.
    - By-law 1150-2026 set that maximum, in force September 1, 2026.
  split: dev
  notes: >
    The consolidated § 608-54E says the fine is "as provided for in the Provincial Offences
    Act"; 1150-2026 cl. 11 replaced that phrase. Giving the old wording as the current rule
    contradicts the first fact. Tempts citing the park rules the fine applies to.

- id: dev-amended-vendor-street
  question: I have a street vending permit for my food cart. Do I also need a permit to occupy the street?
  category: amended_since
  expect: answer
  required:
    - [ "tmc:743-18:*" ]
    - [ "bl:353-2026:cl3" ]
  key_facts:
    - No — a person with a valid Chapter 740 street vending permit is exempt from needing a permit to temporarily occupy the street.
    - By-law 353-2026 added the exemption, in force June 15, 2026.
  split: dev
  notes: >
    The consolidated § 743-18A requires the permit with no exemption; 353-2026 cl. 3 added
    § 743-18G. Saying a permit is still needed contradicts the first fact.

- id: dev-deleted-holistic-fees
  question: I own a holistic centre. Do I have to give the City a list of my services and prices?
  category: amended_since
  expect: answer
  required:
    - [ "tmc:545-181:*" ]
    - [ "bl:1108-2025:cl1:A-C" ]
  key_facts:
    - No — the requirement to file a list of services and fees (§ 545-181) was deleted.
    - By-law 1108-2025 deleted it, in force January 1, 2026.
  split: dev
  notes: >
    A deleted section: the consolidated § 545-181 still prints the duty, and 1108-2025
    cl. 1A deletes it. Presenting § 545-181 as the current rule contradicts the first fact.
